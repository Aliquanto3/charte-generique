name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Lint
        run: uv run --group dev ruff check .
      - name: Tests
        run: uv run --group dev pytest
      - name: Contrastes de la charte
        run: uv run --no-project python -I skills/charte/outils/contrastes.py
      - name: dist/ à jour
        run: uv run --no-project python -I skills/charte/generer.py --verifier
