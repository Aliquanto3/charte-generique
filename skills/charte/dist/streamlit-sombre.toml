# Généré par generer.py depuis charte.tokens.json — ne pas modifier (version 2.0.0).
# Exception connue à la règle « le bleu n'est jamais un aplat de bouton » : Streamlit remplit le bouton
# principal en primaryColor, avec un texte qu'il choisit lui-même. On y met donc `primaire`.
[theme]
base = "dark"
primaryColor = "#8DB0F7"
backgroundColor = "#0F1318"
secondaryBackgroundColor = "#1E242C"
textColor = "#E8ECF2"
linkColor = "#8DB0F7"
borderColor = "#333B46"
font = "'Atkinson Hyperlegible', system-ui, 'Segoe UI', Roboto, sans-serif"
headingFont = "Sora, system-ui, 'Segoe UI', Roboto, sans-serif"
codeFont = "'JetBrains Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace"
baseRadius = "10px"
chartCategoricalColors = ["#8DB0F7", "#E3C26B", "#8CC7A0", "#F2A07B", "#E58FB8", "#6CCAD8", "#A9B4C6", "#9FAE4F"]
