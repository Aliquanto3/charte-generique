[project]
name = "charte-generique"
version = "1.0.0"
description = "Charte graphique générique (sombre d'abord) : jetons DTCG, générateurs, contrôles d'accessibilité et skill Claude Code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# Bibliothèques des spécimens (rendus locaux, hors CI). Ne pas modifier dans une story de spécimen : demander à l’orchestrateur.
specimens = [
    "kaleido>=1.5.0",
    "matplotlib>=3.11.2",
    "pillow>=13.0.0",
    "plotly>=7.1.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pywin32>=312 ; sys_platform == 'win32'",
    "streamlit>=1.66.1",
    "websockets>=17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/charte/outils", "skills/charte"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]

[tool.pyright]
extraPaths = ["skills/charte/outils", "skills/charte"]
